name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Pin the minor version: ruff changes its default rules between minors.
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check --output-format=github .
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install rdkit pytest "mcp>=1.2,<3"
      - run: python -m pytest -q tests
      - name: MCP server starts and lists its tools
        run: |
          python - <<'PY'
          import asyncio, os
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              env = dict(os.environ, CHEMOPS_NO_UV="1")
              params = StdioServerParameters(command="sh", args=["server/run.sh"], env=env)
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      names = {t.name for t in (await s.list_tools()).tools}
                      print(sorted(names))
                      assert "screen_library" in names and "molecule_profile" in names
          asyncio.run(main())
          PY
